apiVersion: v1
kind: Pod
metadata:
  name: emptydir-demo
  namespace: storage-demo
  labels:
    app: emptydir-demo
spec:
  restartPolicy: Always
  containers:
    - name: writer
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      volumeMounts:
        - name: work
          mountPath: /work
  volumes:
    - name: work
      emptyDir:
        sizeLimit: 64Mi
