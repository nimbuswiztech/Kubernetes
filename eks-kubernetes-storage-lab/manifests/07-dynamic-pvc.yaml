apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dynamic-lab-claim
  namespace: storage-demo
  labels:
    app.kubernetes.io/part-of: eks-kubernetes-storage-lab
spec:
  # Replace __STORAGE_CLASS_NAME__ with a discovered, reviewed existing class.
  storageClassName: gp2
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 1Gi
