apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: namespace-quota-demo
  labels: {app.kubernetes.io/name: backend, app.kubernetes.io/part-of: namespace-quota-training}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: backend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: backend, app.kubernetes.io/part-of: namespace-quota-training}
    spec:
      containers:
        - name: responder
          image: busybox:1.36
          command: ["sh", "-c", "while true; do printf 'backend-ok\n'; sleep 30; done"]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
