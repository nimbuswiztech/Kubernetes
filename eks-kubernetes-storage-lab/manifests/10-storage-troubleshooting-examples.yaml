kind: PersistentVolumeClaim
metadata:
  name: invalid-class-example
  namespace: storage-demo
spec:
  storageClassName: replace-with-nonexistent-class
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
