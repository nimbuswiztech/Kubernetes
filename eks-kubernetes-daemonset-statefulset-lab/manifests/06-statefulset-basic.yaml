# Basic identity-only teaching variant. Use 07-statefulset-volume-claims.yaml for storage.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger-basic
  namespace: daemonset-statefulset-demo
spec:
  serviceName: ledger-headless
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-basic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-basic
    spec:
      containers:
        - name: ledger
          image: busybox:1.36
          command: ["/bin/sh", "-c", "while true; do echo $(date -u) $(hostname); sleep 30; done"]
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 50m, memory: 48Mi}
