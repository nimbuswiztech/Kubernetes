apiVersion: v1
kind: Pod
metadata:
  name: required-affinity-demo
  namespace: scheduling-demo
  labels:
    app: required-affinity-demo
spec:
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: training.example.com/workload
                operator: In
                values: [demo]
              - key: kubernetes.io/hostname
                operator: Exists
  containers:
    - name: web
      image: public.ecr.aws/nginx/nginx:stable-alpine
      resources:
        requests: {cpu: 25m, memory: 32Mi}
        limits: {cpu: 100m, memory: 64Mi}
