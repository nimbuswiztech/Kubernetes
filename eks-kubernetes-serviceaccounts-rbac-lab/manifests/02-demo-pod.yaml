apiVersion: v1
kind: Pod
metadata:
  name: demo-sleeper
  namespace: rbac-demo
  labels:
    app.kubernetes.io/part-of: eks-rbac-training
spec:
  serviceAccountName: demo-reader
  automountServiceAccountToken: true
  restartPolicy: Always
  containers:
    - name: sleeper
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["sh", "-c", "sleep 36000"]
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
        capabilities:
          drop: ["ALL"]
