# Optional teaching example; do not apply unless dynamic storage is approved.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: storage-stateful-demo
  namespace: storage-demo
spec:
  serviceName: storage-stateful-demo
  replicas: 1
  selector:
    matchLabels:
      app: storage-stateful-demo
  template:
    metadata:
      labels:
        app: storage-stateful-demo
    spec:
      containers:
        - name: app
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: __STORAGE_CLASS_NAME__
        resources:
          requests:
            storage: 1Gi
