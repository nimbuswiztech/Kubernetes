apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: namespace-quota-demo
  labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: namespace-quota-training}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/part-of: namespace-quota-training}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{name: http, containerPort: 80}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: namespace-quota-demo
  labels: {app.kubernetes.io/part-of: namespace-quota-training}
spec:
  selector: {app.kubernetes.io/name: frontend}
  ports: [{name: http, port: 80, targetPort: http}]
  type: ClusterIP
