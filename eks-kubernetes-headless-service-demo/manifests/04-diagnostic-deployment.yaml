apiVersion: apps/v1
kind: Deployment
metadata:
  name: headless-diagnostic
  namespace: headless-demo
  labels:
    app.kubernetes.io/part-of: headless-service-training
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headless-diagnostic
  template:
    metadata:
      labels:
        app: headless-diagnostic
    spec:
      containers:
        - name: busybox
          image: busybox:1.36
          command: ["sh", "-c", "sleep 36000"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
