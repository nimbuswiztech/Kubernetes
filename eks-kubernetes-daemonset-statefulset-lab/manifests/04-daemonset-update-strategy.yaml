# Apply as a template reference; this is the same workload with explicit rollout strategy.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-observer
  namespace: daemonset-statefulset-demo
spec:
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: node-observer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-observer
      annotations:
        training.example.com/revision: "2"
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: observer
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo revision-2; while true; do date; sleep 60; done"]
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 50m, memory: 48Mi}
