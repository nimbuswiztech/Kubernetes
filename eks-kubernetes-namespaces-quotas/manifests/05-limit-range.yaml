apiVersion: v1
kind: LimitRange
metadata:
  name: container-defaults
  namespace: namespace-quota-demo
  labels: {app.kubernetes.io/part-of: namespace-quota-training}
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 250m
        memory: 256Mi
      min:
        cpu: 50m
        memory: 32Mi
      max:
        cpu: 500m
        memory: 512Mi
