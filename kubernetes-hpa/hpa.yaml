apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: php-apache
  namespace: demo
spec:
  minReplicas: 1
  maxReplicas: 4
  scaleTargetRef:
    apiVersion: apps/v1        # ✅ was extensions/v1
    kind: Deployment
    name: php-apache           # ✅ was node-example
  metrics:
  - type: Resource             # ✅ correct v2 syntax
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 30