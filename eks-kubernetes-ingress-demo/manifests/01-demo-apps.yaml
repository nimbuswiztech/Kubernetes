apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-page
  namespace: ingress-demo
data:
  index.html: |
    <!doctype html><html><head><title>Frontend</title></head>
    <body><h1>Hello from Frontend</h1><p>Kubernetes Ingress basic demo.</p></body></html>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-page
  namespace: ingress-demo
data:
  index.html: |
    <!doctype html><html><head><title>Catalog</title></head>
    <body><h1>Hello from Catalog</h1><p>Kubernetes Ingress basic demo.</p></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: ingress-demo
  labels:
    app: frontend
    app.kubernetes.io/part-of: kubernetes-ingress-basic-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        app.kubernetes.io/part-of: kubernetes-ingress-basic-demo
    spec:
      containers:
      - name: web
        image: nginx:stable-alpine
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 96Mi
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        volumeMounts:
        - name: page
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
      volumes:
      - name: page
        configMap:
          name: frontend-page
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: ingress-demo
  labels:
    app: catalog
    app.kubernetes.io/part-of: kubernetes-ingress-basic-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: catalog
  template:
    metadata:
      labels:
        app: catalog
        app.kubernetes.io/part-of: kubernetes-ingress-basic-demo
    spec:
      containers:
      - name: web
        image: nginx:stable-alpine
        ports:
        - name: http
          containerPort: 80
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 96Mi
        readinessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
        volumeMounts:
        - name: page
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
      volumes:
      - name: page
        configMap:
          name: catalog-page
