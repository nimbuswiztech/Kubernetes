apiVersion: v1
kind: Pod
metadata:
  name: selector-demo
  namespace: scheduling-demo
  labels:
    app: selector-demo
spec:
  nodeSelector:
    training.example.com/workload: demo
  containers:
    - name: web
      image: public.ecr.aws/nginx/nginx:stable-alpine
      ports:
        - containerPort: 80
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
