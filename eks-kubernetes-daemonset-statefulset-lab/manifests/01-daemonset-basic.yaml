apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-observer
  namespace: daemonset-statefulset-demo
  labels:
    app.kubernetes.io/name: node-observer
    app.kubernetes.io/part-of: eks-controller-training
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: node-observer
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node-observer
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: observer
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c", "echo node-observer started on $(hostname); while true; do date -u '+%Y-%m-%dT%H:%M:%SZ node-observer alive'; sleep 60; done"]
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 50m
              memory: 48Mi
