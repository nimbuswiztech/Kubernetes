apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: ingress-demo
  labels:
    app.kubernetes.io/part-of: kubernetes-ingress-basic-demo
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
  - name: http
    port: 80
    targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: ingress-demo
  labels:
    app.kubernetes.io/part-of: kubernetes-ingress-basic-demo
spec:
  type: ClusterIP
  selector:
    app: catalog
  ports:
  - name: http
    port: 80
    targetPort: http
