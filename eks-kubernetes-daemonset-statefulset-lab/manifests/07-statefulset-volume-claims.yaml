apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger
  namespace: daemonset-statefulset-demo
  labels:
    app.kubernetes.io/part-of: eks-controller-training
spec:
  serviceName: ledger-headless
  replicas: 3
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: ledger
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting $(hostname)"
              while true; do
                printf '%s %s\n' "$(date -u '+%Y-%m-%dT%H:%M:%SZ')" "$(hostname)" >> /data/heartbeat.log
                sleep 30
              done
          ports:
            - name: heartbeat
              containerPort: 8080
          resources:
            requests:
              cpu: 10m
              memory: 24Mi
            limits:
              cpu: 50m
              memory: 48Mi
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
