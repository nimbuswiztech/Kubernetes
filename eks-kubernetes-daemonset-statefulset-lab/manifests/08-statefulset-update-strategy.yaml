# Teaching template. Apply with care to the existing ledger StatefulSet after reviewing rollout state.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledger
  namespace: daemonset-statefulset-demo
spec:
  serviceName: ledger-headless
  replicas: 3
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      partition: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger
      annotations:
        training.example.com/revision: "partitioned"
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: ledger
          image: busybox:1.36
          command: ["/bin/sh", "-c", "echo partition-demo; while true; do echo $(date -u) $(hostname) >> /data/heartbeat.log; sleep 30; done"]
          resources:
            requests: {cpu: 10m, memory: 24Mi}
            limits: {cpu: 50m, memory: 48Mi}
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: 1Gi}
