apiVersion: v1
kind: Pod
metadata:
  name: emptydir-shared-demo
  namespace: storage-demo
spec:
  restartPolicy: Always
  containers:
    - name: writer
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["sh", "-c", "echo shared-data > /shared/message.txt; while true; do sleep 3600; done"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      volumeMounts:
        - name: shared
          mountPath: /shared
    - name: reader
      image: public.ecr.aws/docker/library/busybox:1.36
      command: ["sh", "-c", "while true; do sleep 3600; done"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 64Mi}
      volumeMounts:
        - name: shared
          mountPath: /shared
          readOnly: false
  volumes:
    - name: shared
      emptyDir:
        sizeLimit: 32Mi
