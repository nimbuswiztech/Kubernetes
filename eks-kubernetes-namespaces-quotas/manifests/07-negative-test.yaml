apiVersion: v1
kind: Pod
metadata:
  name: quota-negative-test
  namespace: namespace-quota-demo
  labels: {app.kubernetes.io/part-of: namespace-quota-training, purpose: controlled-negative-test}
spec:
  restartPolicy: Never
  containers:
    - name: sleeper
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
      resources:
        requests: {cpu: 600m, memory: 64Mi}
        limits: {cpu: 700m, memory: 128Mi}
